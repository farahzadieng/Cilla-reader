name: Deploy Cilla Reader to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Download model from GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download cilla-mini-480d600 \
            --pattern cilla-mini-models.tar.gz --dir "${RUNNER_TEMP}"
          mkdir -p public/models
          tar -xzf "${RUNNER_TEMP}/cilla-mini-models.tar.gz" -C public/models
          test -s public/models/model.json
          test -s public/models/model/model.safetensors
      - run: npm run build
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
