    .edge { stop-color: #7762bd; }
    .wave { stroke: #fff; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #201836; }
      .glow { stop-color: #9b7bed; }
      .edge { stop-color: #4b317e; }
      .wave { stroke: #f7eeff; }
