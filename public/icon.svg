  <circle cx="256" cy="256" r="150" fill="url(#orb)"/>
  <g class="wave" fill="none" stroke-width="12" stroke-linecap="round" opacity=".85">
    <path d="M136 218c43-54 79-54 120 0s77 54 120 0"/>
