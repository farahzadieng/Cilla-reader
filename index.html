<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f7fc"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><title>cilla. — Words into sound</title></head><body><main><header><a class="brand" href="./">◉ cilla.</a><button id="settings" class="round" aria-label="Preferences">☷</button></header><section class="hero"><p class="eyebrow">YOUR PERSONAL LISTENING SPACE</p><canvas id="orb" width="640" height="520" aria-hidden="true"></canvas><h1 id="headline">Words into sound.</h1><p id="status" role="status">A little less reading. A little more listening.</p></section><button id="paste" class="primary"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="8" y="4" width="8" height="4" rx="1"/><path d="M8 6H5v15h14V6h-3M8 12h8m-8 4h5"/></svg> Paste &amp; Listen <span>↗</span></button><section class="player"><div class="track"><button id="edit" class="plain"><strong id="track">Your audio</strong><small id="detail">Persian · Ready to listen</small></button><button id="more" class="round" aria-label="Edit text">···</button></div><canvas id="wave" width="640" height="70" aria-hidden="true"></canvas><input id="seek" type="range" min="0" max="1" value="0" step="0.01" aria-label="Playback position"><div class="times"><span id="elapsed">00:00</span><span id="duration">00:00</span></div><div class="controls"><button id="back" aria-label="Back 10 seconds">↶<small>10</small></button><button id="play" class="play" aria-label="Play">▶</button><button id="forward" aria-label="Forward 10 seconds">↷<small>10</small></button></div></section><footer>♧ &nbsp; Private by design. Processed on your device.</footer></main><dialog id="prefs"><form method="dialog"><button class="close" aria-label="Close">×</button></form><h2>Preferences</h2><label>Voice<select id="voice"></select></
